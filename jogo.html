<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória - Pastelaria</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #fff3e0, #ffd8a8);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; color: #5a3a1a;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; text-align: center; }
  .sub { font-size: .85rem; opacity: .75; margin-bottom: 12px; text-align: center; }
  .stats {
    display: flex; gap: 20px; font-weight: 700; font-size: 1rem;
    margin-bottom: 14px; background: #fff8; padding: 8px 18px; border-radius: 20px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%; max-width: 420px;
  }
  .card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }
  .inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .4s;
    transform-style: preserve-3d;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    backface-visibility: hidden;
    font-size: 2rem;
    user-select: none;
  }
  .front { /* costas da carta (virada) */
    background: linear-gradient(145deg, #e8590c, #c2410c);
    color: #fff; font-size: 1.6rem;
    box-shadow: 0 3px 6px #0003;
  }
  .back {
    background: #fff; transform: rotateY(180deg);
    box-shadow: 0 3px 6px #0003;
    border: 2px solid #ffd8a8;
  }
  .card.matched .back { background: #d3f9d8; border-color: #69db7c; }
  .card.matched { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.08); } }

  .btn {
    margin-top: 18px;
    padding: 12px 28px;
    font-size: 1rem; font-weight: 700;
    background: #e8590c; color: #fff;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 10px #e8590c55;
  }
  .btn:active { transform: scale(.96); }
  .msg { margin-top: 12px; font-weight: 700; color: #2b8a3e; text-align: center; min-height: 1.2em; }
  .footer { margin-top: 16px; font-size: .8rem; opacity: .6; }
</style>
</head>
<body>

<h1>🥟 Jogo da Memória</h1>
<div class="sub">Encontre os pares de sabores!</div>

<div class="stats">
  <span>Jogadas: <span id="moves">0</span></span>
  <span>Pares: <span id="pairs">0</span>/8</span>
</div>

<div class="board" id="board"></div>

<button class="btn" onclick="startGame()">Jogar de novo</button>
<div class="msg" id="msg"></div>
<div class="footer">Pastelaria — jogue enquanto espera seu pastel 😋</div>

<script>
const sabores = ['🥩','🧀','🍕','🌿','🐔','🍤','🍫','🥬']; // carne, queijo, pizza, palmito, frango, camarão, chocolate, verdura

let deck = [], first = null, lock = false, moves = 0, matched = 0;
const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const msgEl = document.getElementById('msg');

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  deck = shuffle([...sabores, ...sabores]);
  first = null; lock = false; moves = 0; matched = 0;
  movesEl.textContent = 0;
  pairsEl.textContent = 0;
  msgEl.textContent = '';
  board.innerHTML = '';

  deck.forEach((sabor, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.sabor = sabor;
    card.innerHTML = `
      <div class="inner">
        <div class="face front">?</div>
        <div class="face back">${sabor}</div>
      </div>`;
    card.addEventListener('click', () => flip(card));
    board.appendChild(card);
  });
}

function flip(card) {
  if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');

  if (!first) {
    first = card;
    return;
  }

  moves++;
  movesEl.textContent = moves;
  lock = true;

  if (first.dataset.sabor === card.dataset.sabor) {
    // par encontrado
    setTimeout(() => {
      first.classList.add('matched');
      card.classList.add('matched');
      matched++;
      pairsEl.textContent = matched;
      first = null; lock = false;
      if (matched === sabores.length) win();
    }, 350);
  } else {
    // errou
    setTimeout(() => {
      first.classList.remove('flipped');
      card.classList.remove('flipped');
      first = null; lock = false;
    }, 800);
  }
}

function win() {
  msgEl.textContent = `🎉 Você venceu em ${moves} jogadas! Bom apetite!`;
}

startGame();
</script>
</body>
</html>
