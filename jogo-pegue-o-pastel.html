<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A Jornada do Pastel - Pasterry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  
  :root {
    --amarelo: #fcd116;
    --laranja: #e8590c;
    --marrom: #4a0e14;
    --verde: #8cc63f;
    --vermelho: #e03131;
    --azul: #1c7ed6;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--amarelo);
    background-image: radial-gradient(var(--laranja) 1px, transparent 1px);
    background-size: 20px 20px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px; color: var(--marrom); overflow: hidden;
  }

  /* BOTÃO VOLTAR AO MENU */
  .btn-back {
    position: fixed; top: 15px; left: 15px;
    background: var(--marrom); color: var(--amarelo);
    text-decoration: none; padding: 8px 15px;
    border-radius: 20px; font-weight: 800; font-size: 0.8rem;
    border: 3px solid var(--amarelo); box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    z-index: 100; transition: transform 0.1s;
  }
  .btn-back:active { transform: scale(0.95); }

  .header-top {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 400px; margin-bottom: 10px; margin-top: 40px;
    background: var(--marrom); padding: 5px 15px; border-radius: 15px;
    border: 3px solid var(--amarelo); box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    z-index: 10;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-container {
    width: 35px; height: 35px; border-radius: 50%; background: #fff;
    overflow: hidden; border: 2px solid var(--amarelo);
    display: flex; justify-content: center; align-items: center;
  }
  .logo-container img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-family: 'Brush Script MT', cursive; font-size: 1.8rem; color: var(--amarelo); margin-top: 5px;}
  
  .player-tag {
    color: var(--amarelo); font-size: 0.8rem; font-weight: 800;
    text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-end;
  }
  .player-tag span { font-size: 0.6rem; font-weight: normal; color: #aaa;}

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 400px; margin-bottom: 5px;
    background: #fff; padding: 5px 12px; border-radius: 10px;
    border: 3px solid var(--marrom); font-weight: 900; font-size: 0.9rem;
    box-shadow: 0 4px 0 var(--marrom); z-index: 10;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; }
  .hud-item span { font-size: 0.6rem; color: #888; }
  .hud-item strong { font-size: 1rem; color: var(--laranja); }

  #game-container {
    position: relative; background: #fff;
    border: 4px solid var(--marrom); border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    overflow: hidden; width: 100%; max-width: 400px; height: 65vh;
    touch-action: none; display: flex; justify-content: center;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(255, 253, 248, 0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 20px; text-align: center; z-index: 10;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; color: var(--laranja); margin-bottom: 5px;}
  .overlay p { font-size: 0.95rem; line-height: 1.5; }
  
  .trophy { font-size: 3rem; animation: float 2s infinite alternate; margin-bottom: 10px; display: inline-block; }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-10px); } }

  .btn {
    padding: 10px 20px; font-size: 0.9rem; font-weight: 800;
    background: var(--laranja); color: var(--amarelo);
    border: none; border-radius: 20px; cursor: pointer;
    box-shadow: 0 4px 0 var(--marrom); transition: transform 0.1s; margin-top: 10px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--marrom); }

  .ranking-box {
    background: #fff8e1; border: 2px solid var(--laranja);
    border-radius: 10px; padding: 8px; width: 100%; margin-top: 10px; font-size: 0.85rem;
    max-height: 200px;
    overflow-y: auto;
  }
  .ranking-box h3 { font-size: 0.8rem; color: var(--marrom); margin-bottom: 4px; text-transform: uppercase; }
  .rank-line { display: flex; justify-content: space-between; border-bottom: 1px dashed #ffd8a8; padding: 4px 0; font-weight: 700;}
  .rank-line:last-child { border: none; }

  .controls-hint {
    margin-top: 15px; font-size: 0.8rem; color: #888; text-align: center;
  }
</style>
</head>
<body>

<!-- BOTÃO DE VOLTAR AO INDEX -->
<a href="index.html" class="btn-back">🏠 Início</a>

<div class="header-top">
  <div class="logo-area">
    <div class="logo-container">
      <img src="img/logo.jpg" onerror="this.style.display='none'; this.parentElement.innerHTML='🥟';">
    </div>
    <div class="brand-name">Pasterry</div>
  </div>
  <div class="player-tag" id="playerTag">
    <span>JOGADOR</span>
    <div id="playerTagName">-</div>
  </div>
</div>

<div class="hud">
  <div class="hud-item">
    <span>PONTOS</span>
    <strong id="hudScore">0</strong>
  </div>
  <div class="hud-item">
    <span>VIDAS</span>
    <strong id="hudLives">❤️❤️❤️</strong>
  </div>
  <div class="hud-item">
    <span>RECORDE</span>
    <strong id="hudHighScore">0</strong>
  </div>
</div>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <div class="overlay" id="overlay">
    <div class="trophy" id="overlayIcon">🍽️</div>
    <h2 id="overlayTitle">A Jornada do Pastel</h2>
    <p id="overlayText">Mova o prato para pegar os pastéis e desviar das bombas!</p>
    
    <div class="ranking-box" id="rankingBox" style="display:none;">
      <h3>🏆 Top 10 Clientes</h3>
      <div id="rankingList"></div>
    </div>

    <button class="btn" id="startBtn">Jogar</button>
  </div>
</div>

<div class="controls-hint">
  Use o <b>mouse</b> ou deslize o dedo na tela para mover.
</div>

<script>
// ==========================================
// CONFIGURAÇÃO INICIAL
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const hudScore = document.getElementById('hudScore');
const hudLives = document.getElementById('hudLives');
const hudHighScore = document.getElementById('hudHighScore');
const overlay = document.getElementById('overlay');
const overlayIcon = document.getElementById('overlayIcon');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const rankingBox = document.getElementById('rankingBox');
const rankingList = document.getElementById('rankingList');
const startBtn = document.getElementById('startBtn');

let playerName = localStorage.getItem('pasterryBubbleName') || 'ANÔNIMO';
document.getElementById('playerTagName').textContent = playerName;

let highScore = parseInt(localStorage.getItem('pasterryPastelHighScore') || '0', 10);
hudHighScore.textContent = highScore;

let rankings = JSON.parse(localStorage.getItem('pasterryPastelRankings') || '[]');

// ==========================================
// ESTADO DO JOGO
// ==========================================
let gameWidth = 0;
let gameHeight = 0;
let score = 0;
let lives = 3;
let isGameOver = false;
let animationId = null;
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 1000; // Começa caindo 1 item por segundo
let speedMultiplier = 1;

// Entidades
let player = { x: 0, y: 0, width: 70, height: 30, speed: 0.8 };
let items = [];
let particles = [];

// Configuração dos Itens
const ITEM_TYPES = [
  { emoji: '🥟', type: 'pastel', points: 10, color: '#fcd116' },
  { emoji: '🥩', type: 'pastel', points: 15, color: '#e03131' },
  { emoji: '🧀', type: 'pastel', points: 15, color: '#fcc419' },
  { emoji: '🍕', type: 'pastel', points: 20, color: '#e8590c' },
  { emoji: '💣', type: 'bomb', points: 0, color: '#4a0e14' }
];

// ==========================================
// INICIALIZAÇÃO DO CANVAS
// ==========================================
function setupCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  
  gameWidth = rect.width;
  gameHeight = rect.height;
  
  canvas.width = gameWidth * dpr;
  canvas.height = gameHeight * dpr;
  canvas.style.width = gameWidth + 'px';
  canvas.style.height = gameHeight + 'px';
  ctx.scale(dpr, dpr);
  
  player.x = gameWidth / 2 - player.width / 2;
  player.y = gameHeight - 50;
}

// ==========================================
// LÓGICA DO JOGO
// ==========================================
function resetGame() {
  score = 0;
  lives = 3;
  isGameOver = false;
  spawnTimer = 0;
  spawnInterval = 1000;
  speedMultiplier = 1;
  items = [];
  particles = [];
  
  hudScore.textContent = score;
  hudLives.textContent = '❤️❤️❤️';
  
  player.x = gameWidth / 2 - player.width / 2;
  
  overlay.classList.add('hidden');
  
  lastTime = performance.now();
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (isGameOver) return;
  
  const dt = Math.min((now - lastTime) / 1000, 0.1); 
  lastTime = now;
  
  update(dt);
  draw();
  
  animationId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // Movimento do jogador (suavizado)
  if (targetX !== null) {
    const diff = targetX - (player.x + player.width / 2);
    player.x += diff * player.speed;
    
    // Limita às bordas
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > gameWidth) player.x = gameWidth - player.width;
  }

  // Geração de itens
  spawnTimer += dt * 1000;
  if (spawnTimer > spawnInterval) {
    spawnItem();
    spawnTimer = 0;
    
    // Aumenta a dificuldade gradualmente
    if (spawnInterval > 300) spawnInterval -= 10;
    speedMultiplier += 0.01;
  }

  // Atualiza itens caindo
  for (let i = items.length - 1; i >= 0; i--) {
    let item = items[i];
    item.y += item.speed * speedMultiplier * dt * 60;
    
    // Colisão com o prato
    if (
      item.y + item.size > player.y &&
      item.y < player.y + player.height &&
      item.x + item.size > player.x &&
      item.x < player.x + player.width
    ) {
      if (item.type === 'pastel') {
        score += item.points;
        hudScore.textContent = score;
        playBeep(800, 'sine', 0.1);
        createParticles(item.x, item.y, item.color);
      } else if (item.type === 'bomb') {
        lives--;
        updateLivesDisplay();
        playBeep(150, 'sawtooth', 0.4);
        createParticles(item.x, item.y, '#e03131');
        
        if (lives <= 0) {
          gameOver();
        }
      }
      items.splice(i, 1);
      continue;
    }
    
    // Remove se saiu da tela
    if (item.y > gameHeight) {
      if (item.type === 'pastel') {
        // Perdeu um pastel (opcional: não penaliza, apenas ignora)
      }
      items.splice(i, 1);
    }
  }

  // Atualiza partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    p.vy += 0.5; // Gravidade
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function spawnItem() {
  const randomType = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
  const size = 35;
  
  items.push({
    x: Math.random() * (gameWidth - size),
    y: -size,
    size: size,
    speed: 200 + Math.random() * 100,
    ...randomType
  });
}

function updateLivesDisplay() {
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  hudLives.textContent = hearts || '💔';
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 0.5,
      color: color,
      size: Math.random() * 5 + 3
    });
  }
}

// ==========================================
// RENDERIZAÇÃO
// ==========================================
function draw() {
  ctx.clearRect(0, 0, gameWidth, gameHeight);
  
  // Fundo (padrão de mesa)
  ctx.fillStyle = '#fffdf8';
  ctx.fillRect(0, 0, gameWidth, gameHeight);
  ctx.strokeStyle = 'rgba(0,0,0,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < gameWidth; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, gameHeight); ctx.stroke();
  }
  for (let i = 0; i < gameHeight; i += 40) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(gameWidth, i); ctx.stroke();
  }

  // Itens caindo
  items.forEach(item => {
    if (item.type === 'bomb') {
      // Desenha um fundo vermelho para a bomba
      ctx.fillStyle = 'rgba(224, 49, 49, 0.2)';
      ctx.beginPath();
      ctx.arc(item.x + item.size/2, item.y + item.size/2, item.size/2 + 5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.font = `${item.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, item.x + item.size/2, item.y + item.size/2);
  });

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = p.life * 2;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Jogador (Prato)
  ctx.fillStyle = '#4a0e14';
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.width, player.height, 10);
  ctx.fill();
  
  // Detalhe do prato (borda laranja)
  ctx.strokeStyle = '#e8590c';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(player.x + 2, player.y + 2, player.width - 4, player.height - 4, 8);
  ctx.stroke();
  
  // Emoji de prato no centro
  ctx.font = '20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍽️', player.x + player.width/2, player.y + player.height/2 + 2);
}

// ==========================================
// CONTROLES
// ==========================================
let targetX = null;

function handlePointerMove(e) {
  if (isGameOver) return;
  const rect = canvas.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  targetX = clientX - rect.left;
}

function handlePointerDown(e) {
  if (isGameOver) return;
  e.preventDefault();
  handlePointerMove(e);
}

canvas.addEventListener('mousemove', handlePointerMove);
canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// ==========================================
// FIM DE JOGO E RANKING
// ==========================================
function gameOver() {
  isGameOver = true;
  clearInterval(animationId);
  playBeep(100, 'sawtooth', 0.5);
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('pasterryPastelHighScore', highScore);
    hudHighScore.textContent = highScore;
  }
  
  rankings.push({ name: playerName, score: score });
  rankings.sort((a, b) => b.score - a.score);
  rankings = rankings.slice(0, 10);
  localStorage.setItem('pasterryPastelRankings', JSON.stringify(rankings));
  
  rankingList.innerHTML = rankings.map((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}º`;
    return `<div class="rank-line"><span>${medal} ${r.name}</span><b>${r.score}</b></div>`;
  }).join('');
  
  rankingBox.style.display = 'block';
  
  if (score >= highScore && score > 0) {
    overlayTitle.textContent = "NOVO RECORDE!";
    overlayIcon.textContent = "👑";
  } else {
    overlayTitle.textContent = "Game Over";
    overlayIcon.textContent = "💥";
  }
  
  overlayText.innerHTML = `Você fez <b>${score}</b> pontos.<br>Tente novamente enquanto o pastel não chega!`;
  startBtn.textContent = "Jogar Novamente";
  overlay.classList.remove('hidden');
}

// ==========================================
// ÁUDIO
// ==========================================
let audioCtx;
function playBeep(freq, type, duration) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// ==========================================
// BOTÕES E INICIALIZAÇÃO
// ==========================================
startBtn.onclick = () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  setupCanvas();
  resetGame();
};

setupCanvas();
draw();
</script>
</body>
</html>
