<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pasterry Jigsaw - Quebra-Cabeça</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  
  :root {
    --amarelo: #fcd116;
    --laranja: #e8590c;
    --marrom: #4a0e14;
    --verde: #8cc63f;
    --vermelho: #e03131;
    --azul: #1c7ed6;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--amarelo);
    background-image: radial-gradient(var(--laranja) 1px, transparent 1px);
    background-size: 20px 20px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px; color: var(--marrom); overflow: hidden;
  }

  /* BOTÃO VOLTAR AO MENU */
  .btn-back {
    position: fixed; top: 15px; left: 15px;
    background: var(--marrom); color: var(--amarelo);
    text-decoration: none; padding: 8px 15px;
    border-radius: 20px; font-weight: 800; font-size: 0.8rem;
    border: 3px solid var(--amarelo); box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    z-index: 100; transition: transform 0.1s;
  }
  .btn-back:active { transform: scale(0.95); }

  .header-top {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 400px; margin-bottom: 10px; margin-top: 40px;
    background: var(--marrom); padding: 5px 15px; border-radius: 15px;
    border: 3px solid var(--amarelo); box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    z-index: 10;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-container {
    width: 35px; height: 35px; border-radius: 50%; background: #fff;
    overflow: hidden; border: 2px solid var(--amarelo);
    display: flex; justify-content: center; align-items: center;
  }
  .logo-container img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-family: 'Brush Script MT', cursive; font-size: 1.8rem; color: var(--amarelo); margin-top: 5px;}
  
  .player-tag {
    color: var(--amarelo); font-size: 0.8rem; font-weight: 800;
    text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-end;
  }
  .player-tag span { font-size: 0.6rem; font-weight: normal; color: #aaa;}

  /* TELAS */
  .screen {
    display: none; flex-direction: column; align-items: center;
    width: 100%; max-width: 400px;
  }
  .screen.active { display: flex; }

  .welcome-box {
    background: #fff; border: 4px solid var(--marrom); border-radius: 15px;
    padding: 20px; text-align: center; width: 100%; margin-top: 20px;
    box-shadow: 0 8px 0 var(--marrom);
  }
  .welcome-box h2 { font-size: 1.3rem; color: var(--laranja); margin-bottom: 10px;}
  .name-input {
    width: 100%; padding: 12px; font-size: 1.1rem; text-align: center;
    border: 3px solid var(--marrom); border-radius: 10px;
    font-weight: 800; color: var(--marrom); outline: none; text-transform: uppercase;
    margin-bottom: 10px;
  }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 400px; margin-bottom: 5px;
    background: #fff; padding: 5px 12px; border-radius: 10px;
    border: 3px solid var(--marrom); font-weight: 900; font-size: 0.9rem;
    box-shadow: 0 4px 0 var(--marrom); z-index: 10;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; }
  .hud-item span { font-size: 0.6rem; color: #888; }
  .hud-item strong { font-size: 1rem; color: var(--laranja); }

  .game-actions {
    display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 10px;
  }
  .action-btn {
    flex: 1; padding: 8px; font-size: 0.8rem; font-weight: 800;
    background: var(--azul); color: #fff;
    border: 3px solid var(--marrom); border-radius: 10px;
    cursor: pointer; box-shadow: 0 3px 0 var(--marrom);
    transition: transform 0.1s;
  }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--marrom); }
  .action-btn.reset { background: var(--vermelho); }
  .action-btn.menu { background: #6c757d; }

  #game-container {
    position: relative; background: #fff;
    border: 4px solid var(--marrom); border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    overflow: hidden; width: 100%; max-width: 400px;
    display: flex; justify-content: center; align-items: center;
    padding: 10px;
  }
  
  #puzzle-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--marrom);
    padding: 4px;
    border-radius: 8px;
  }
  
  .puzzle-piece {
    background-color: #fff;
    background-size: 300% 300%;
    background-position: center;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    position: relative;
  }
  
  .puzzle-piece.selected {
    box-shadow: 0 0 0 4px var(--verde), inset 0 0 10px rgba(0,0,0,0.2);
    transform: scale(0.95);
    z-index: 2;
  }
  
  .puzzle-piece.correct {
    box-shadow: 0 0 0 2px var(--verde);
  }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(255, 253, 248, 0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 20px; text-align: center; z-index: 10;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; color: var(--laranja); margin-bottom: 5px;}
  .overlay p { font-size: 0.95rem; line-height: 1.5; }
  
  .trophy { font-size: 3rem; animation: float 2s infinite alternate; margin-bottom: 10px; display: inline-block; }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-10px); } }

  .btn {
    padding: 10px 20px; font-size: 0.9rem; font-weight: 800;
    background: var(--laranja); color: var(--amarelo);
    border: none; border-radius: 20px; cursor: pointer;
    box-shadow: 0 4px 0 var(--marrom); transition: transform 0.1s; margin-top: 10px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--marrom); }

  .ranking-box {
    background: #fff8e1; border: 2px solid var(--laranja);
    border-radius: 10px; padding: 8px; width: 100%; margin-top: 10px; font-size: 0.85rem;
    max-height: 200px;
    overflow-y: auto;
  }
  .ranking-box h3 { font-size: 0.8rem; color: var(--marrom); margin-bottom: 4px; text-transform: uppercase; }
  .rank-line { display: flex; justify-content: space-between; border-bottom: 1px dashed #ffd8a8; padding: 4px 0; font-weight: 700;}
  .rank-line:last-child { border: none; }

  .controls-hint {
    margin-top: 15px; font-size: 0.8rem; color: #888; text-align: center;
  }
</style>
</head>
<body>

<!-- BOTÃO DE VOLTAR AO INDEX -->
<a href="index.html" class="btn-back">🏠 Início</a>

<div class="header-top">
  <div class="logo-area">
    <div class="logo-container">
      <img src="img/logo.jpg" onerror="this.style.display='none'; this.parentElement.innerHTML='🥟';">
    </div>
    <div class="brand-name">Pasterry</div>
  </div>
  <div class="player-tag" id="playerTag" style="display:none;">
    <span>JOGADOR</span>
    <div id="playerTagName">-</div>
  </div>
</div>

<!-- TELA 1: NOME -->
<div class="screen active" id="welcomeScreen">
  <div class="welcome-box">
    <h2>Bem-vindo ao Pasterry Jigsaw!</h2>
    <p style="font-size:0.85rem; margin-bottom:10px;">Monte o quebra-cabeça dos nossos pastéis.</p>
    <input type="text" id="inputName" class="name-input" placeholder="Seu Nome" maxlength="10">
    <button class="btn" id="startJourneyBtn" style="width: 100%;">Entrar no Jogo</button>
  </div>
</div>

<!-- TELA 2: O JOGO -->
<div class="screen" id="gameScreen">
  <div class="hud">
    <div class="hud-item">
      <span>MOVIMENTOS</span>
      <strong id="hudMoves">0</strong>
    </div>
    <div class="hud-item">
      <span>PEÇAS CERTAS</span>
      <strong id="hudCorrect">0 / 9</strong>
    </div>
    <div class="hud-item">
      <span>RECORDE</span>
      <strong id="hudHighScore">0</strong>
    </div>
  </div>

  <div class="game-actions">
    <button class="action-btn reset" id="resetGameBtn">🔄 Embaralhar</button>
    <button class="action-btn menu" id="backToMenuBtn">⬅️ Menu</button>
  </div>

  <div id="game-container">
    <div id="puzzle-container"></div>
    
    <div class="overlay" id="overlay">
      <div class="trophy" id="overlayIcon">🧩</div>
      <h2 id="overlayTitle">Pasterry Jigsaw</h2>
      <p id="overlayText">Arraste as peças para montar a imagem!</p>
      
      <div class="ranking-box" id="rankingBox" style="display:none;">
        <h3>🏆 Top 10 Jogadores</h3>
        <div id="rankingList"></div>
      </div>

      <button class="btn" id="startBtn">Jogar</button>
    </div>
  </div>

  <div class="controls-hint">
    Clique em uma peça e depois na outra para trocar.
  </div>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO INICIAL
// ==========================================
const puzzleContainer = document.getElementById('puzzle-container');
const hudMoves = document.getElementById('hudMoves');
const hudCorrect = document.getElementById('hudCorrect');
const hudHighScore = document.getElementById('hudHighScore');
const overlay = document.getElementById('overlay');
const overlayIcon = document.getElementById('overlayIcon');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const rankingBox = document.getElementById('rankingBox');
const rankingList = document.getElementById('rankingList');
const startBtn = document.getElementById('startBtn');

// Telas
const welcomeScreen = document.getElementById('welcomeScreen');
const gameScreen = document.getElementById('gameScreen');
const inputName = document.getElementById('inputName');
const playerTag = document.getElementById('playerTag');
const playerTagName = document.getElementById('playerTagName');

let playerName = localStorage.getItem('pasterryJigsawName') || '';
let highScore = parseInt(localStorage.getItem('pasterryJigsawHighScore') || '0', 10);
hudHighScore.textContent = highScore;

let rankings = JSON.parse(localStorage.getItem('pasterryJigsawRankings') || '[]');

// ==========================================
// ESTADO DO JOGO
// ==========================================
const GRID_SIZE = 3;
const TOTAL_PIECES = GRID_SIZE * GRID_SIZE;

let currentImage = '';
let pieces = []; // Array de IDs na ordem atual do tabuleiro
let selectedIndex = -1;
let moves = 0;
let isGameOver = false;

// Lista de imagens para sortear
const IMAGE_LIST = [
  'img/c1.png', 'img/pizza1.png', 'img/hotdog.png', 'img/coca1.png', 
  'img/lasanha.png', 'img/choco1-so-chocolate-ao-leite.png', 
  'img/logo.jpg', 'img/mineiro1.png', 'img/bauru1.png'
];

// ==========================================
// LÓGICA DO JOGO
// ==========================================
function resetGame() {
  puzzleContainer.innerHTML = '';
  pieces = [];
  selectedIndex = -1;
  moves = 0;
  isGameOver = false;
  
  hudMoves.textContent = moves;
  hudCorrect.textContent = `0 / ${TOTAL_PIECES}`;
  
  overlay.classList.add('hidden');
  
  // Sorteia uma imagem
  currentImage = IMAGE_LIST[Math.floor(Math.random() * IMAGE_LIST.length)];
  
  // Cria a lista de IDs (0 a 8) e embaralha
  pieces = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  
  // Embaralha garantindo que não esteja resolvido
  do {
    pieces.sort(() => Math.random() - 0.5);
  } while (isSolved());
  
  renderPuzzle();
  updateCorrectCount();
}

function renderPuzzle() {
  puzzleContainer.innerHTML = '';
  
  pieces.forEach((id, index) => {
    const pieceEl = document.createElement('div');
    pieceEl.className = 'puzzle-piece';
    pieceEl.dataset.index = index;
    pieceEl.dataset.id = id;
    
    // Define a imagem de fundo com base no ID original (posição correta)
    const row = Math.floor(id / GRID_SIZE);
    const col = id % GRID_SIZE;
    pieceEl.style.backgroundImage = `url('${currentImage}')`;
    pieceEl.style.backgroundPosition = `${col * 50}% ${row * 50}%`;
    
    // Verifica se está na posição correta
    if (id === index) {
      pieceEl.classList.add('correct');
    }
    
    pieceEl.addEventListener('click', () => handlePieceClick(index));
    puzzleContainer.appendChild(pieceEl);
  });
}

function handlePieceClick(index) {
  if (isGameOver) return;
  
  const pieceEl = document.querySelector(`.puzzle-piece[data-index="${index}"]`);
  
  if (selectedIndex === -1) {
    // Seleciona a primeira peça
    selectedIndex = index;
    pieceEl.classList.add('selected');
    playBeep(600, 'sine', 0.05);
  } else if (selectedIndex === index) {
    // Desmarca se clicar na mesma
    selectedIndex = -1;
    pieceEl.classList.remove('selected');
  } else {
    // Troca as peças
    const temp = pieces[selectedIndex];
    pieces[selectedIndex] = pieces[index];
    pieces[index] = temp;
    
    moves++;
    hudMoves.textContent = moves;
    playBeep(800, 'sine', 0.1);
    
    // Re-renderiza
    renderPuzzle();
    updateCorrectCount();
    checkVictory();
    
    selectedIndex = -1;
  }
}

function updateCorrectCount() {
  const correct = pieces.filter((id, index) => id === index).length;
  hudCorrect.textContent = `${correct} / ${TOTAL_PIECES}`;
}

function isSolved() {
  return pieces.every((id, index) => id === index);
}

function checkVictory() {
  if (isSolved()) {
    isGameOver = true;
    playBeep(800, 'sine', 0.1);
    setTimeout(() => playBeep(1000, 'sine', 0.1), 100);
    setTimeout(() => playBeep(1200, 'sine', 0.1), 200);
    setTimeout(() => playBeep(1600, 'sine', 0.3), 300);
    
    if (moves < highScore || highScore === 0) {
      highScore = moves;
      localStorage.setItem('pasterryJigsawHighScore', highScore);
      hudHighScore.textContent = highScore;
    }
    
    rankings.push({ name: playerName, score: moves });
    rankings.sort((a, b) => a.score - b.score); // Menor é melhor
    rankings = rankings.slice(0, 10);
    localStorage.setItem('pasterryJigsawRankings', JSON.stringify(rankings));
    
    rankingList.innerHTML = rankings.map((r, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}º`;
      return `<div class="rank-line"><span>${medal} ${r.name}</span><b>${r.score} mov</b></div>`;
    }).join('');
    
    rankingBox.style.display = 'block';
    
    overlayTitle.textContent = "PARABÉNS!";
    overlayIcon.textContent = "🏆";
    overlayText.innerHTML = `Você montou o quebra-cabeça em <b>${moves}</b> movimentos!`;
    startBtn.textContent = "Jogar Novamente";
    overlay.classList.remove('hidden');
  }
}

// ==========================================
// ÁUDIO
// ==========================================
let audioCtx;
function playBeep(freq, type, duration) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// ==========================================
// INICIALIZAÇÃO DO JOGO
// ==========================================
function initApp() {
  if (playerName) {
    inputName.value = playerName;
    startGameScreen();
  } else {
    welcomeScreen.classList.add('active');
  }
}

document.getElementById('startJourneyBtn').addEventListener('click', () => {
  const typedName = inputName.value.trim().toUpperCase();
  if (!typedName) { alert("Por favor, digite seu nome!"); return; }
  playerName = typedName;
  localStorage.setItem('pasterryJigsawName', playerName);
  playBeep(600, 'sine', 0.1);
  startGameScreen();
});

function startGameScreen() {
  welcomeScreen.classList.remove('active');
  gameScreen.classList.add('active');
  
  playerTag.style.display = 'flex';
  playerTagName.textContent = playerName;
  
  overlay.classList.remove('hidden');
  overlayTitle.textContent = "Pasterry Jigsaw";
  overlayIcon.textContent = "🧩";
  overlayText.innerHTML = `Prepare-se, <b>${playerName}</b>!<br>Monte o quebra-cabeça dos pastéis!`;
  startBtn.textContent = "Jogar";
  rankingBox.style.display = 'none';
  
  startBtn.onclick = () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    resetGame();
  };
}

// BOTÕES DE AÇÃO
document.getElementById('resetGameBtn').addEventListener('click', () => {
  if (confirm("Embaralhar novamente?")) {
    resetGame();
  }
});

document.getElementById('backToMenuBtn').addEventListener('click', () => {
  if (confirm("Voltar ao menu inicial?")) {
    gameScreen.classList.remove('active');
    welcomeScreen.classList.add('active');
  }
});

// Inicializa o app
initApp();
</script>
</body>
</html>
